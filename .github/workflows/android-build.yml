name: Build Android APK & AAB

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (apk / aab / both)'
        required: true
        default: 'both'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install
          npx cap sync android

      - name: 🔧 Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: 🔨 Build Android APK
        if: github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: |
          cd android
          ./gradlew assembleDebug

      - name: 🔨 Build Android AAB (Bundle)
        if: github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both'
        run: |
          cd android
          ./gradlew bundleRelease || ./gradlew bundleDebug

      - name: 💾 Lưu file APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-apk
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30

      - name: 💾 Lưu file AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-aab
          path: android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
