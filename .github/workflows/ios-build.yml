name: Build iOS & Upload to App Store

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (versionCode)'
        required: false
        default: '1'

# Chỉ cho phép 1 build chạy cùng lúc
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 35

    env:
      APP_BUNDLE_ID: com.vn.mv.chinesegames
      APP_SCHEME: App
      XCODE_PROJECT_PATH: ios/App
      APPLE_TEAM_ID: KV7JYX42NM

    steps:
      # ========== CHECKOUT & SETUP ==========
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js (v22)
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install
          npx cap sync ios

      # ========== KIỂM TRA SECRETS ==========
      - name: 🔍 Kiểm tra Apple signing secrets
        id: check_secrets
        env:
          P12: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$P12" ] && [ -n "$PROFILE" ]; then
            echo "has_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Đã tìm thấy Apple Certificate và Provisioning Profile!"
          else
            echo "has_secrets=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Chưa phát hiện Apple Certificate trong Secrets."
            echo "👉 Workflow sẽ tự động build kiểm tra (Unsigned Build) và tạo file cài đặt để bạn tải về."
          fi

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASS" ]; then
            echo "can_upload=true" >> $GITHUB_OUTPUT
            echo "upload_method=credentials" >> $GITHUB_OUTPUT
            echo "✅ Sẽ tự động upload lên App Store Connect bằng Apple ID & App-Specific Password!"
          elif [ -n "$API_KEY" ]; then
            echo "can_upload=true" >> $GITHUB_OUTPUT
            echo "upload_method=api_key" >> $GITHUB_OUTPUT
            echo "✅ Sẽ tự động upload lên App Store Connect bằng API Key!"
          else
            echo "can_upload=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Chưa cấu hình thông tin upload tự động. File IPA sẽ được lưu trong Artifacts."
          fi

      # ========== SIGNING SETUP (Chạy khi ĐÃ có secrets) ==========
      - name: 🔐 Install Apple certificate
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          python3 -c "import base64, os; open('$CERTIFICATE_PATH', 'wb').write(base64.b64decode(os.environ['P12_BASE64']))"

          security import $CERTIFICATE_PATH \
            -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          EXISTING_KEYCHAINS=$(security list-keychains -d user | tr -d '" \t')
          security list-keychains -d user -s $KEYCHAIN_PATH $EXISTING_KEYCHAINS
          security default-keychain -s $KEYCHAIN_PATH

      - name: 📱 Install provisioning profile
        if: steps.check_secrets.outputs.has_secrets == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          python3 -c "import base64, os; open('$PP_PATH', 'wb').write(base64.b64decode(os.environ['PROVISIONING_PROFILE_BASE64']))"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$PP_PATH" > $RUNNER_TEMP/profile.plist
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" $RUNNER_TEMP/profile.plist)
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

      # ========== RELEASE BUILD & EXPORT (Chạy khi ĐÃ có secrets) ==========
      - name: 🔨 Build & Archive (Signed Release)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cd $XCODE_PROJECT_PATH

          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$APP_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number || github.run_number }}" \
            MARKETING_VERSION="1.0.0" \
            CODE_SIGN_STYLE="Manual" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            -allowProvisioningUpdates

      - name: 📦 Export IPA (App Store)
        if: steps.check_secrets.outputs.has_secrets == 'true'
        run: |
          cat <<EOF > $RUNNER_TEMP/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>$APPLE_TEAM_ID</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Apple Distribution</string>
              <key>stripSwiftSymbols</key>
              <true/>
              <key>uploadSymbols</key>
              <true/>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$APP_BUNDLE_ID</key>
                  <string>$PROVISIONING_PROFILE_UUID</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/output \
            -allowProvisioningUpdates

      - name: 🚀 Upload to App Store Connect
        if: steps.check_secrets.outputs.has_secrets == 'true' && steps.check_secrets.outputs.can_upload == 'true'
        env:
          UPLOAD_METHOD: ${{ steps.check_secrets.outputs.upload_method }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
        run: |
          IPA_FILE=$(find $RUNNER_TEMP/output -name "*.ipa" | head -n 1)
          echo "📦 Chuẩn bị upload: $IPA_FILE"

          if [ "$UPLOAD_METHOD" = "credentials" ]; then
            echo "🔐 Đang upload lên App Store Connect bằng Apple ID ($APPLE_ID)..."
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --username "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --asc-provider "$APPLE_TEAM_ID" 2>/dev/null || \
            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --username "$APPLE_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD"
          else
            echo "🔐 Đang upload lên App Store Connect bằng API Key..."
            mkdir -p ~/private_keys
            python3 -c "import base64, os; open(os.path.expanduser('~/private_keys/AuthKey_${API_KEY_ID}.p8'), 'wb').write(base64.b64decode(os.environ['APP_STORE_CONNECT_API_KEY_BASE64']))"

            xcrun altool --upload-app \
              --type ios \
              --file "$IPA_FILE" \
              --apiKey "$API_KEY_ID" \
              --apiIssuer "$API_ISSUER_ID"
          fi

          echo "🎉 Upload lên App Store Connect thành công rực rỡ!"

      # ========== UNSIGNED BUILD (Tự động chạy khi CHƯA có secrets) ==========
      - name: 🔨 Build iOS Project (Unsigned / Kiểm tra code)
        if: steps.check_secrets.outputs.has_secrets != 'true'
        run: |
          cd $XCODE_PROJECT_PATH

          echo "🚀 Đang tiến hành build toàn bộ code iOS trên môi trường macOS..."
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme "$APP_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath $RUNNER_TEMP/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number || github.run_number }}" \
            MARKETING_VERSION="1.0.0"

          mkdir -p $RUNNER_TEMP/output
          APP_PATH=$(find $RUNNER_TEMP/DerivedData -name "*.app" -type d | head -n 1)
          if [ -n "$APP_PATH" ]; then
            cd $(dirname "$APP_PATH")
            zip -r $RUNNER_TEMP/output/App-Unsigned.zip $(basename "$APP_PATH")
            echo "✅ Đã nén thành công $RUNNER_TEMP/output/App-Unsigned.zip"
          fi

      # ========== SAVE ARTIFACT ==========
      - name: 💾 Lưu file App đã build (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-output
          path: ${{ runner.temp }}/output/*
          retention-days: 30

      # ========== SUMMARY ==========
      - name: 📋 Báo cáo tổng kết
        run: |
          if [ "${{ steps.check_secrets.outputs.has_secrets }}" = "true" ]; then
            echo "### 🚀 Kết quả: Build iOS Release & Upload App Store thành công! 🎉" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ Build iOS hoàn thành thành công (Chế độ Unsigned)! 🎉" >> $GITHUB_STEP_SUMMARY
            echo "Toàn bộ code iOS và Capacitor đã được biên dịch thành công trên máy macOS của GitHub." >> $GITHUB_STEP_SUMMARY
            echo "Bạn có thể tải file **ios-build-output** trong mục Artifacts để kiểm tra." >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "#### Để upload trực tiếp lên App Store Connect:" >> $GITHUB_STEP_SUMMARY
            echo "Vui lòng thêm các Secrets sau tại **Settings > Secrets and variables > Actions**:" >> $GITHUB_STEP_SUMMARY
            echo "1. \`P12_CERTIFICATE_BASE64\`" >> $GITHUB_STEP_SUMMARY
            echo "2. \`P12_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "3. \`KEYCHAIN_PASSWORD\`" >> $GITHUB_STEP_SUMMARY
            echo "4. \`PROVISIONING_PROFILE_BASE64\`" >> $GITHUB_STEP_SUMMARY
            echo "5. \`API_KEY_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "6. \`API_ISSUER_ID\`" >> $GITHUB_STEP_SUMMARY
            echo "7. \`APP_STORE_CONNECT_API_KEY_BASE64\`" >> $GITHUB_STEP_SUMMARY
          fi

      # ========== CLEANUP ==========
      - name: 🧹 Dọn dẹp an toàn
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -f $RUNNER_TEMP/profile.mobileprovision
