name: Build iOS & Upload to App Store

on:
  # Chạy thủ công từ GitHub Actions tab
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (versionCode)'
        required: false
        default: '1'

# Chỉ cho phép 1 build chạy cùng lúc
concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    env:
      APP_BUNDLE_ID: com.vn.mv.chinesegames
      APP_SCHEME: App
      XCODE_PROJECT_PATH: ios/App

    steps:
      # ========== CHECKOUT & SETUP ==========
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci || npm install
          npx cap sync ios

      # ========== SIGNING SETUP ==========
      - name: 🔐 Install Apple certificate
        env:
          P12_BASE64: ${{ secrets.P12_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Tạo keychain tạm thời
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$P12_BASE64" | base64 --decode > $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH \
            -k $KEYCHAIN_PATH \
            -P "$P12_PASSWORD" \
            -A -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      - name: 📱 Install provisioning profile
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: |
          PP_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH

          # Cài provisioning profile
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< $(/usr/bin/security cms -D -i $PP_PATH))
          cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$UUID.mobileprovision

          echo "PROVISIONING_PROFILE_UUID=$UUID" >> $GITHUB_ENV

      # ========== BUILD ==========
      - name: 🔨 Build & Archive
        run: |
          cd $XCODE_PROJECT_PATH

          xcodebuild archive \
            -project App.xcodeproj \
            -scheme "$APP_SCHEME" \
            -sdk iphoneos \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$APP_BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.event.inputs.build_number || '1' }}" \
            MARKETING_VERSION="1.0.0" \
            CODE_SIGN_STYLE="Manual" \
            PROVISIONING_PROFILE="$PROVISIONING_PROFILE_UUID" \
            -allowProvisioningUpdates

      # ========== EXPORT IPA ==========
      - name: 📦 Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/output \
            -allowProvisioningUpdates

      # ========== UPLOAD TO APP STORE ==========
      - name: 🚀 Upload to App Store Connect
        env:
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.API_ISSUER_ID }}
        run: |
          # Tạo API Key file
          mkdir -p ~/private_keys
          echo "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode > ~/private_keys/AuthKey_${API_KEY_ID}.p8

          # Upload bằng xcrun
          xcrun notarytool store-credentials "AC_PASSWORD" \
            --key ~/private_keys/AuthKey_${API_KEY_ID}.p8 \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" 2>/dev/null || true

          # Upload IPA
          xcrun altool --upload-app \
            --type ios \
            --file $RUNNER_TEMP/output/*.ipa \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

          echo "✅ Upload thành công! Kiểm tra trên App Store Connect."

      # ========== SAVE ARTIFACT ==========
      - name: 💾 Save IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-ipa
          path: ${{ runner.temp }}/output/*.ipa
          retention-days: 30

      # ========== CLEANUP ==========
      - name: 🧹 Cleanup
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/certificate.p12
          rm -f $RUNNER_TEMP/profile.mobileprovision
